<!-- <fieldset> + <legend> dibujan el contorno "partido" por la etiqueta, igual que el
     campo outline de Material que usa <app-selector-buscable>: sin arma, la etiqueta se
     muestra dentro del campo; con arma, "flota" sobre el borde superior. -->
<fieldset class="campo-selector" [class.con-valor]="valor()">
  <legend class="campo-etiqueta" [attr.aria-hidden]="!valor()">{{ etiqueta() }}</legend>

  <button type="button" class="campo-boton" aria-haspopup="dialog" (click)="abrir()">
    @let gogma = valor()?.gogma;
    @let arma = valor()?.arma;
    @if (gogma) {
      <!-- ⚒️ Arma Gogma: sin nombre, solo el icono de su tipo y, como etiquetas, elemento,
           habilidades de set y huecos -->
      <img
        class="campo-icono"
        [src]="iconoTipo(gogma.tipo)"
        [alt]="'weaponPicker.gogmaName' | translate: { name: ('weaponTypes.' + gogma.tipo | translate) }"
        width="28"
        height="28" />
      <span class="campo-texto campo-gogma">
        <span class="gogma-etiquetas">
          @if (especialGogma(); as especial) {
            <span class="gogma-etiqueta">{{ especial.icono }} {{ especial.claveNombre | translate }}</span>
          }
          @for (habilidad of habilidadesSet(gogma); track habilidad.id) {
            <span class="gogma-etiqueta bonus" [title]="'armorPicker.filters.setSkills' | translate">
              <span aria-hidden="true">🎖️</span> {{ habilidad.name }}
            </span>
          }
          <span class="gogma-huecos" [title]="'weaponPicker.gogmaForm.slots' | translate">
            @for (nivel of huecosGogma; track $index) {
              <span class="hueco">{{ nivel }}</span>
            }
          </span>
        </span>
      </span>
    } @else if (arma) {
      <img class="campo-icono" [src]="iconoTipo(arma.kind)" [alt]="'weaponTypes.' + arma.kind | translate" width="28" height="28" />
      <span class="campo-texto">{{ arma.name }}</span>
    } @else {
      <span class="campo-texto campo-placeholder">{{ etiqueta() }}</span>
    }
    <span class="campo-flecha" aria-hidden="true">▾</span>
  </button>

  @if (permitirQuitar() && valor()) {
    <button
      type="button"
      class="campo-quitar"
      [attr.aria-label]="'weaponPicker.remove' | translate"
      [title]="'weaponPicker.remove' | translate"
      (click)="quitar()">×</button>
  }
</fieldset>
