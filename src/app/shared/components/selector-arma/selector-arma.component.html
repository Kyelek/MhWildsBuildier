<!-- <fieldset> + <legend> dibujan el contorno "partido" por la etiqueta, igual que el
     campo outline de Material que usa <app-selector-buscable>: sin arma, la etiqueta se
     muestra dentro del campo; con arma, "flota" sobre el borde superior. -->
<fieldset class="campo-selector" [class.con-valor]="valor()">
  <legend class="campo-etiqueta" [attr.aria-hidden]="!valor()">{{ etiqueta() }}</legend>

  <button type="button" class="campo-boton" aria-haspopup="dialog" (click)="abrir()">
    @if (valor(); as arma) {
      <img class="campo-icono" [src]="iconoTipo(arma.kind)" [alt]="'weaponTypes.' + arma.kind | translate" width="28" height="28" />
      <span class="campo-texto">{{ arma.name }}</span>
    } @else {
      <span class="campo-texto campo-placeholder">{{ etiqueta() }}</span>
    }
    <span class="campo-flecha" aria-hidden="true">▾</span>
  </button>

  @if (permitirQuitar() && valor()) {
    <button
      type="button"
      class="campo-quitar"
      [attr.aria-label]="'weaponPicker.remove' | translate"
      [title]="'weaponPicker.remove' | translate"
      (click)="quitar()">×</button>
  }
</fieldset>
